name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q AboZahra_GitHub_Ready.zip
      - run: sed -i 's/singleLine = true/setSingleLine(true)/' BlackHoleAndroid/app/src/main/java/com/blackhole/downloader/MainActivity.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: gradle assembleDebug --no-daemon -p BlackHoleAndroid
      - uses: actions/upload-artifact@v4
        with:
          name: AboZahra-APK
          path: BlackHoleAndroid/app/build/outputs/apk/debug/app-debug.apk
